services:
  agent:
    build:
      context: .
      dockerfile: Containerfile
    container_name: local-agent-core
    working_dir: /app
    environment:
      MODEL_BASE_URL: http://host.containers.internal:8000/v1
      MODEL_NAME: Qwen/Qwen3-8B-MLX-4bit
      MODEL_TIMEOUT_SECONDS: 180
      MODEL_MAX_RETRIES: 2
      TASK_RETENTION_DAYS: "0"
      SANDBOX_ENABLED: "true"
      SANDBOX_URL: http://sandbox:8002
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Export a random token with at least 32 characters}
      SANDBOX_TIMEOUT_SECONDS: 180
      WORKSPACE: /workspace
      DATABASE_PATH: /data/workbench.db
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./workspace:/workspace:rw
      - ./agent:/app/agent:ro
      - ./data:/data:rw
    networks:
      - agent_net
      - sandbox_net
    depends_on:
      sandbox:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:size=256m
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: local-agent-sandbox
    working_dir: /workspace
    environment:
      WORKSPACE: /workspace
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Export a random token with at least 32 characters}
    volumes:
      - ./workspace:/workspace:rw
    networks:
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/agent/.cache:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  agent_net:
  sandbox_net:
    internal: true
